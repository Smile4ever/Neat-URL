name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "lts/*"
        cache: npm
    - name: Install
      run: npm ci --ignore-scripts
    - name: Test
      run: npm test
    - name: Build
      run: |
        npm run build:zip
        echo "VERSION=$(node -p "require('./manifest.json').version")" >> "$GITHUB_ENV"
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: neat-url-${{ env.VERSION }}
        path: web-ext-artifacts/neat_url-${{ env.VERSION }}.*.zip
