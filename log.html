<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="css/log.css">
	<link rel="icon" type="image/png" href="icons/neaturl-48.png" sizes="48x48">
	<title>Neat URL</title>
  </head>
  <body>
	<header>
		<h1 data-i18n="show_log">Log</h1>
		<p data-i18n="log_descr">The last URLs that Neat URL cleaned. The log is only kept in memory and is empty after a browser restart.</p>
		<div class="toolbar">
			<input type="search" id="filter" data-i18n-placeholder="log_filter" placeholder="Filter">
			<button type="button" id="clear"><span data-i18n="log_clear">Clear</span></button>
		</div>
	</header>

	<p id="empty" data-i18n="log_empty">No URLs have been cleaned yet.</p>

	<table id="log" hidden>
		<thead>
			<tr>
				<th data-i18n="log_column_time">Time</th>
				<th data-i18n="log_column_type">Type</th>
				<th data-i18n="log_column_url">URL</th>
			</tr>
		</thead>
		<tbody></tbody>
	</table>

	<script src="log.js"></script>
  </body>
</html>
